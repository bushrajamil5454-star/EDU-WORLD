
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduWorld - Courses</title>

    <style>
        body {

    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f5f7ff;
}

        .courses {
            display: flex;
            gap: 15px;
            padding: 20px;
        }

        .course-card {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        .web {
            background-color: #f0eaff;
        }

        .database {
            background-color: #e6f4ff;
        }

        .python {
            background-color: #e5f8ee;
        }

        .icon {
            font-size: 30px;
        }

        .course-card h3 {
            color: #173d75;
            font-size: 18px;
        }

        .course-card p {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        .course-card a {
            color: #6045d8;
            text-decoration: none;
            font-weight: bold;
        }

        .course-card a:hover {
            text-decoration: underline;
        }

      

.quote {
    background-image: url("mountain.png");
    background-size: 100% auto;
    background-position: center;
    background-repeat: no-repeat;

    min-height: 200px;
    color: white;
    text-align: center;
    padding: 100px 20px;

}

    </style>
</head>

<body>

    <section class="courses">

        <div class="course-card web">
            <div class="icon">💻</div>
            <h3>Web Technologies</h3>
            <p>Learn HTML, CSS and JavaScript.</p>
            <a href="#">Learn More »</a>
        </div>

        <div class="course-card database">
            <div class="icon">🗄️</div>
            <h3>Database Systems</h3>
            <p>Work with real-world databases.</p>
            <a href="#">Learn More »</a>
        </div>

        <div class="course-card python">
            <div class="icon">🐍</div>
            <h3>Python Programming</h3>
            <p>Build logic and solve problems.</p>
            <a href="#">Learn More »</a>
        </div>

    </section>

    <section class="quote">
        <h2>"Small steps every day<br>lead to big results."</h2>
    </section>

</body>
</html>
